service: cat-colony-backend

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 30
  
  environment:
    NODE_ENV: ${self:provider.stage}
    DATABASE_URL: ${env:DATABASE_URL}
    PRISMA_ACCELERATE_URL: ${env:PRISMA_ACCELERATE_URL, ''}
    CORS_ORIGIN: ${env:CORS_ORIGIN, '*'}
    JWT_SECRET: ${env:JWT_SECRET}
    API_VERSION: ${env:API_VERSION, 'v1'}
    RATE_LIMIT_WINDOW_MS: ${env:RATE_LIMIT_WINDOW_MS, '900000'}
    RATE_LIMIT_MAX_REQUESTS: ${env:RATE_LIMIT_MAX_REQUESTS, '100'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs:*:*:*"

functions:
  api:
    handler: dist/lambda/handler.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

plugins:
  - serverless-plugin-typescript
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    host: 0.0.0.0
    stage: dev
    noAuth: true

package:
  exclude:
    - node_modules/aws-sdk/**
    - node_modules/@types/**
    - src/**
    - tests/**
    - '*.md'
    - '.env*'
    - '.git/**'
    - 'prisma/migrations/**'